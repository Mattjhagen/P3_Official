services:
  - type: web
    name: p3-lending-backup
    env: docker
    dockerfilePath: ./failover/Dockerfile
    plan: free
    autoDeploy: false
    region: oregon
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: p3-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://p3lending.space
      - key: POSTGRES_HOST
        fromDatabase:
          name: p3-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: p3-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: p3-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: p3-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: p3-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587

databases:
  - name: p3-postgres
    plan: free
    databaseName: p3lending
    user: p3user
    region: oregon

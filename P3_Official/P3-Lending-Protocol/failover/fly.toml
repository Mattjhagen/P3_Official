# Fly.io configuration for P3 Lending backup
# https://fly.io/docs/reference/configuration/

app = "p3-lending-backup"
primary_region = "sjc"

[build]
  dockerfile = "../Dockerfile.failover"

[env]
  NODE_ENV = "production"
  PORT = "5001"
  FRONTEND_URL = "https://p3lending.space"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[services]]
  protocol = "tcp"
  internal_port = 5001
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[services.ports]]
  port = 80
  handlers = ["http"]

[[services.ports]]
  port = 443
  handlers = ["tls", "http"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
